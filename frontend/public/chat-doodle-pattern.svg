<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none" stroke="#181426" color="#181426" stroke-linecap="round" stroke-linejoin="round">

  <!-- 1. Two People Chatting (Boy & Girl with Chat Bubble in Between) -->
  <g transform="translate(20, 20)" stroke-width="1.4">
    <!-- Boy Avatar (left) -->
    <circle cx="10" cy="10" r="7" />
    <path d="M4 8 C5 4 15 4 16 8" /> <!-- short hair -->
    <path d="M1 25 C1 19 6 18 10 18 C14 18 19 19 19 25" />

    <!-- Floating Heart Chat Bubble between them -->
    <path d="M18 6 C18 3 24 3 24 6 C24 8 21 10 21 10 C21 10 18 8 18 6 Z" fill="currentColor" fill-opacity="0.2" stroke-width="1" />

    <!-- Girl Avatar (right) -->
    <circle cx="32" cy="10" r="7" />
    <path d="M25 10 C25 4 39 4 39 10 V14" /> <!-- hair with flow -->
    <path d="M23 25 C23 19 28 18 32 18 C36 18 41 19 41 25" />
  </g>

  <!-- 2. Isometric Mini Rubik's Cube -->
  <g transform="translate(130, 20)" stroke-width="1.3">
    <!-- Cube outline -->
    <path d="M18 2 L32 10 V26 L18 34 L4 26 V10 Z" />
    <!-- Center Y split -->
    <path d="M18 2 V18 M18 18 L32 10 M18 18 L4 10 M18 18 V34" />
    <!-- Grid segments for 3x3 Rubik's faces -->
    <path d="M11 6 L25 14 M9 22 L23 30 M25 6 L11 14 M25 22 L11 30" stroke-width="1" stroke-dasharray="1 1" opacity="0.7" />
  </g>

  <!-- 3. Retro Phone Call / "Recall" Receiver with Signal Waves -->
  <g transform="translate(235, 20)" stroke-width="1.5">
    <!-- Phone handset -->
    <path d="M6 10 C5 7 7 4 10 4 L13 8 L10 11 C11 15 15 19 19 20 L22 17 L26 20 C26 23 23 25 20 24 C12 22 8 18 6 10 Z" />
    <!-- Recall loop / Audio signal ripples -->
    <path d="M24 6 C28 9 28 14 24 17" stroke-width="1.2" />
    <path d="M28 3 C34 7 34 19 28 23" stroke-width="1.2" />
  </g>

  <!-- 4. Chatimall Official Logo Bubble -->
  <g transform="translate(345, 18)" stroke-width="1.5">
    <path d="M14 3.5C7.9 3.5 3 8 3 13.6C3 16.2 4 18.5 5.8 20.3L4.5 24.5L9.7 23C11 23.4 12.5 23.6 14 23.6C20.1 23.6 25 19.1 25 13.6C25 8 20.1 3.5 14 3.5Z" />
    <ellipse cx="14" cy="13.5" rx="4.5" ry="4" stroke-width="1.2" />
  </g>

  <!-- 5. "Small Rooms. Big Feelings." 4-Point Sparkle -->
  <g transform="translate(440, 22)" stroke-width="1.4">
    <path d="M16 2 L19 12 L29 15 L19 18 L16 28 L13 18 L3 15 L13 12 Z" />
    <circle cx="28" cy="5" r="1.5" fill="currentColor" stroke="none" />
  </g>

  <!-- 6. Smiling Love Emoji with Heart Eyes -->
  <g transform="translate(25, 115)" stroke-width="1.4">
    <circle cx="16" cy="16" r="15" />
    <!-- Left Heart Eye -->
    <path d="M9 10 C8 8 6 8 5.5 10 C4.5 12 9 15 9 15 C9 15 13.5 12 12.5 10 C12 8 10 8 9 10 Z" fill="currentColor" stroke="none" />
    <!-- Right Heart Eye -->
    <path d="M23 10 C22 8 20 8 19.5 10 C18.5 12 23 15 23 15 C23 15 27.5 12 26.5 10 C26 8 24 8 23 10 Z" fill="currentColor" stroke="none" />
    <!-- Happy open smile -->
    <path d="M9 19 C11 24 21 24 23 19" />
  </g>

  <!-- 7. Minimalist Sound Frequency Bars (Voice Note) -->
  <g transform="translate(130, 115)" stroke-width="2">
    <line x1="4" y1="12" x2="4" y2="20" />
    <line x1="9" y1="6" x2="9" y2="26" />
    <line x1="14" y1="2" x2="14" y2="30" />
    <line x1="19" y1="8" x2="19" y2="24" />
    <line x1="24" y1="13" x2="24" y2="19" />
    <line x1="29" y1="5" x2="29" y2="27" />
    <line x1="34" y1="11" x2="34" y2="21" />
  </g>

  <!-- 8. Connected Message Thread Nodes -->
  <g transform="translate(235, 105)" stroke-width="1.4">
    <!-- Bubble 1 -->
    <rect x="0" y="0" width="28" height="16" rx="8" />
    <line x1="6" y1="8" x2="18" y2="8" stroke-width="1.5" />
    <!-- Connector dotted pulse line -->
    <path d="M14 16 C14 26 34 20 34 30" stroke-dasharray="2 3" />
    <!-- Bubble 2 -->
    <rect x="20" y="30" width="30" height="16" rx="8" />
    <line x1="26" y1="38" x2="42" y2="38" stroke-width="1.5" />
  </g>

  <!-- 9. Dynamic Island Pill Notch with Camera Dot -->
  <g transform="translate(345, 110)" stroke-width="1.4">
    <rect x="0" y="6" width="46" height="18" rx="9" />
    <circle cx="34" cy="15" r="2.5" fill="currentColor" stroke="none" />
    <line x1="12" y1="15" x2="24" y2="15" stroke-width="1.8" />
  </g>

  <!-- 10. Concentric Orbit Rings -->
  <g transform="translate(440, 105)" stroke-width="1.3">
    <circle cx="16" cy="16" r="16" stroke-dasharray="3 4" opacity="0.6" />
    <circle cx="16" cy="16" r="10" />
    <circle cx="16" cy="16" r="4" fill="currentColor" stroke="none" />
  </g>

  <!-- 11. Pulse Heartbeat Capsule (ECG Wave) -->
  <g transform="translate(20, 205)" stroke-width="1.4">
    <rect x="0" y="4" width="48" height="24" rx="12" />
    <path d="M7 16 H14 L17 9 L21 23 L25 10 L28 19 L31 16 H41" stroke-width="1.6" />
  </g>

  <!-- 12. "conversation is glowing" Pulse Beacon with Rings -->
  <g transform="translate(130, 205)" stroke-width="1.4">
    <circle cx="16" cy="16" r="3.5" fill="currentColor" stroke="none" />
    <circle cx="16" cy="16" r="8.5" stroke-dasharray="2 3" />
    <circle cx="16" cy="16" r="14.5" stroke-dasharray="3 4" opacity="0.6" />
  </g>

  <!-- 13. "The Look at This" Camera -->
  <g transform="translate(235, 200)" stroke-width="1.4">
    <path d="M4 10 H10 L12 6 H24 L26 10 H32 C34 10 36 12 36 14 V30 C36 32 34 34 32 34 H4 C2 34 0 32 0 30 V14 C0 12 2 10 4 10 Z" />
    <circle cx="18" cy="22" r="6" />
    <circle cx="28" cy="14" r="1.5" fill="currentColor" stroke="none" />
  </g>

  <!-- 14. "Private Room" Padlock with Pulse Line -->
  <g transform="translate(350, 200)" stroke-width="1.4">
    <rect x="4" y="11" width="24" height="19" rx="5" />
    <path d="M9 11 V7 C9 3.7 12 1 16 1 C20 1 23 3.7 23 7 V11" />
    <circle cx="16" cy="19" r="2" fill="currentColor" stroke="none" />
    <path d="M16 21 V25" stroke-width="1.6" />
  </g>

  <!-- 15. Chatimall Compact Composer Pill -->
  <g transform="translate(435, 200)" stroke-width="1.3">
    <rect x="0" y="6" width="52" height="24" rx="12" />
    <line x1="9" y1="18" x2="15" y2="18" stroke-width="1.5" />
    <line x1="12" y1="15" x2="12" y2="21" stroke-width="1.5" />
    <circle cx="41" cy="18" r="5.5" />
    <path d="M39 18 L43 18 M41 16 L43 18 L41 20" stroke-width="1.2" />
  </g>

  <!-- 16. "Late-Night Drift" Moon & Twilight Sparkle -->
  <g transform="translate(25, 305)" stroke-width="1.4">
    <path d="M18 3 C10 6 5 15 8 23 C11 31 20 35 28 31 C20 31 14 23 16 15 C17 10 21 6 25 5 C22 3.5 20 3 18 3 Z" />
    <path d="M30 6 L31.5 10 L35.5 11 L31.5 12 L30 16 L28.5 12 L24.5 11 L28.5 10 Z" />
  </g>

  <!-- 17. Minimalist "pulse / online" Status Pill -->
  <g transform="translate(130, 310)" stroke-width="1.4">
    <rect x="0" y="6" width="46" height="18" rx="9" />
    <circle cx="10" cy="15" r="3" fill="currentColor" stroke="none" />
    <line x1="18" y1="15" x2="38" y2="15" stroke-width="1.6" />
  </g>

  <!-- 18. "Say it like you mean it" Underline Arc -->
  <g transform="translate(235, 310)" stroke-width="2">
    <path d="M2 14 Q 22 2, 42 12" />
    <circle cx="8" cy="5" r="1.5" fill="currentColor" stroke="none" />
    <circle cx="38" cy="4" r="1.2" fill="currentColor" stroke="none" />
  </g>

  <!-- 19. Instant Paper Plane with Pulse Trail -->
  <g transform="translate(345, 305)" stroke-width="1.4">
    <path d="M2 24 L34 10 L12 40 L16 26 L26 29 Z" />
    <path d="M34 10 L16 26" />
    <path d="M0 32 C-2 36 -6 38 -8 40" stroke-dasharray="2 2" />
  </g>

  <!-- 20. Fast Action Zap Badge -->
  <g transform="translate(445, 305)" stroke-width="1.4">
    <rect x="0" y="2" width="30" height="30" rx="9" />
    <path d="M16 7 L9 17 H16 L14 25 L21 15 H14 L16 7 Z" stroke-width="1.4" fill="currentColor" fill-opacity="0.15" />
  </g>

  <!-- 21. "The Quiet Check-In" Envelope with Heart -->
  <g transform="translate(25, 400)" stroke-width="1.4">
    <rect x="0" y="4" width="36" height="26" rx="4" />
    <path d="M0 6 L18 20 L36 6" />
    <path d="M18 15 C16.5 13 14 14 14 16 C14 18.5 18 21 18 21 C18 21 22 18.5 22 16 C22 14 19.5 13 18 15 Z" fill="currentColor" stroke="none" />
  </g>

  <!-- 22. Secondary Chatimall Mini Logo Floating -->
  <g transform="translate(135, 395)" stroke-width="1.5">
    <path d="M11 2.5C6 2.5 2 6 2 10.5C2 12.6 2.8 14.5 4.2 16L3 19.5L7.3 18.2C8.4 18.7 9.7 19 11 19C16 19 20 15.5 20 10.5C20 6 16 2.5 11 2.5Z" />
    <ellipse cx="11" cy="10.5" rx="3.5" ry="3" stroke-width="1" />
  </g>

  <!-- 23. The Little Room Entrance Doorway -->
  <g transform="translate(240, 395)" stroke-width="1.4">
    <path d="M4 32 V6 C4 3.8 6.8 2 10 2 H22 C25.2 2 28 3.8 28 6 V32" />
    <circle cx="22" cy="17" r="2" fill="currentColor" stroke="none" />
    <line x1="0" y1="32" x2="32" y2="32" stroke-width="1.8" />
  </g>

  <!-- 24. Delivered & Read Double Wave Indicator -->
  <g transform="translate(345, 400)" stroke-width="1.6">
    <path d="M2 14 L8 20 L20 6" />
    <path d="M10 20 L22 6" />
    <circle cx="26" cy="12" r="2" fill="currentColor" stroke="none" />
  </g>

  <!-- 25. Geometric Sparkle Star Cluster -->
  <g transform="translate(440, 395)" stroke-width="1.4">
    <path d="M12 0 L14 7 L21 9 L14 11 L12 18 L10 11 L3 9 L10 7 Z" />
    <path d="M25 15 L26 19 L30 20 L26 21 L25 25 L24 21 L20 20 L24 19 Z" stroke-width="1.1" />
  </g>

</svg>
